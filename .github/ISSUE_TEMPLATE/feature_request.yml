name: Feature request
description: Suggest an improvement to the template.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the README's **Limitations and non-goals** first. Never include secrets or identifiers of your organisation or app.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Mention any store or LifeTime API it relies on.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
