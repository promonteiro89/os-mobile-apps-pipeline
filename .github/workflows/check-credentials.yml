name: Check connections

# Read-only: confirms the LifeTime, Google Play and App Store Connect credentials can see the app in config/app.json.
# Uploads nothing and changes nothing in any store.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_FROZEN: "true"

jobs:
  plan:
    name: Read app config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      android_package: ${{ steps.plan.outputs.android_package }}
      ios_bundle_id: ${{ steps.plan.outputs.ios_bundle_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # No network and no secrets: which platforms config/app.json lists, and their identifiers.
      - id: plan
        run: python3 scripts/lifetime.py plan

  lifetime:
    name: LifeTime build status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Show native build status in every environment
        env:
          LIFETIME_HOST: ${{ vars.LIFETIME_HOST }}
          LIFETIME_API_TOKEN: ${{ secrets.LIFETIME_API_TOKEN }}
        run: python scripts/lifetime.py status

  android:
    name: Google Play access
    needs: plan
    # Skipped when config/app.json doesn't list android.
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
      # No shared gem cache in jobs that hold store keys: install from Gemfile.lock, checksums verified.
      - run: bundle install --jobs 4
      - name: Check Google Play access
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          ANDROID_PACKAGE: ${{ needs.plan.outputs.android_package }}
        run: bundle exec fastlane android check_access

  ios:
    name: App Store Connect access
    needs: plan
    # Skipped when config/app.json doesn't list ios.
    if: needs.plan.outputs.ios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
      # No shared gem cache in jobs that hold store keys: install from Gemfile.lock, checksums verified.
      - run: bundle install --jobs 4
      - name: Check App Store Connect access
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_BUNDLE_ID: ${{ needs.plan.outputs.ios_bundle_id }}
        run: bundle exec fastlane ios check_access
